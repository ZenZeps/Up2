<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Up2</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .logo {
            width: 60px;
            height: 60px;
            background: #007AFF;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }
        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .btn {
            background: #007AFF;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin: 10px;
            transition: background 0.3s;
        }
        .btn:hover {
            background: #0056CC;
        }
        .btn-secondary {
            background: #f1f1f1;
            color: #333;
        }
        .btn-secondary:hover {
            background: #e1e1e1;
        }
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
        }
        .status.loading {
            background: #e3f2fd;
            color: #1976d2;
        }
        .status.success {
            background: #e8f5e8;
            color: #2e7d32;
        }
        .status.error {
            background: #ffebee;
            color: #c62828;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">U2</div>
        <h1>Reset Your Password</h1>
        <p>Click the button below to open the Up2 app and reset your password securely.</p>
        
        <a href="#" id="openApp" class="btn">Open Up2 App</a>
        <a href="#" id="downloadApp" class="btn btn-secondary" style="display: none;">Download Up2</a>
        
        <div id="status" class="status loading" style="display: none;">
            Attempting to open the app...
        </div>
        
        <div id="instructions" style="display: none; margin-top: 20px; font-size: 14px; color: #666;">
            <p><strong>Can't open the app?</strong></p>
            <p>1. Make sure you have the Up2 app installed</p>
            <p>2. Copy this link and paste it in your browser: <br>
               <code id="deepLink" style="background: #f5f5f5; padding: 5px; border-radius: 4px; word-break: break-all;"></code>
            </p>
        </div>
    </div>

    <script>
        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('userId');
        const secret = urlParams.get('secret');
        const expire = urlParams.get('expire');

        // Create deep link
        const deepLink = `up2://reset-password?userId=${userId}&secret=${secret}&expire=${expire}`;
        
        document.getElementById('deepLink').textContent = deepLink;
        
        // Set up button click handlers
        document.getElementById('openApp').addEventListener('click', function(e) {
            e.preventDefault();
            
            // Show loading status
            document.getElementById('status').style.display = 'block';
            document.getElementById('status').className = 'status loading';
            document.getElementById('status').textContent = 'Attempting to open the app...';
            
            // Try to open the app
            window.location.href = deepLink;
            
            // After a short delay, show fallback options
            setTimeout(function() {
                document.getElementById('status').className = 'status error';
                document.getElementById('status').textContent = 'Unable to open the app automatically.';
                document.getElementById('downloadApp').style.display = 'inline-block';
                document.getElementById('instructions').style.display = 'block';
            }, 3000);
        });

        // Download app button (you can update these URLs to your actual app store links)
        document.getElementById('downloadApp').addEventListener('click', function(e) {
            e.preventDefault();
            
            // Detect platform and redirect to appropriate store
            const userAgent = navigator.userAgent || navigator.vendor || window.opera;
            
            if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                // iOS
                window.open('https://apps.apple.com/app/up2', '_blank');
            } else if (/android/i.test(userAgent)) {
                // Android
                window.open('https://play.google.com/store/apps/details?id=com.up2.Up2', '_blank');
            } else {
                // Desktop or other
                alert('The Up2 app is available on iOS and Android app stores.');
            }
        });

        // Auto-attempt to open app on page load (mobile only)
        if (/Mobi|Android/i.test(navigator.userAgent)) {
            // Small delay to let page render
            setTimeout(function() {
                document.getElementById('openApp').click();
            }, 1000);
        }

        // Handle missing parameters
        if (!userId || !secret) {
            document.getElementById('status').style.display = 'block';
            document.getElementById('status').className = 'status error';
            document.getElementById('status').textContent = 'Invalid or expired reset link. Please request a new password reset.';
            document.getElementById('openApp').style.display = 'none';
        }
    </script>
</body>
</html>
