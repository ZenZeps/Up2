<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Up2 Event Invite</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
        }

        h1 {
            color: #fff;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .event-info {
            background: rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn {
            display: inline-block;
            padding: 15px 30px;
            margin: 10px;
            background: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: #45a049;
            transform: translateY(-2px);
        }

        .secondary {
            background: #2196F3;
        }

        .secondary:hover {
            background: #1976D2;
        }

        .opening-text {
            margin: 20px 0;
            font-size: 18px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.7;
            }

            100% {
                opacity: 1;
            }
        }

        .logo {
            font-size: 3em;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">🎉</div>
        <h1>You're Invited!</h1>
        <div class="event-info">
            <h2 id="eventTitle">Loading event...</h2>
            <p><strong id="eventDate">📅</strong></p>
            <p><strong id="eventLocation">📍</strong></p>
            <p id="inviterName">Invited by:</p>
        </div>
        <div class="opening-text">
            <p>Opening Up2 app...</p>
            <p><small>If the app doesn't open automatically, use the buttons below:</small></p>
        </div>
        <a href="#" id="openApp" class="btn">Open in Up2 App</a><br>
        <a href="https://apps.apple.com/app/up2" class="btn secondary">Download for iOS</a>
        <a href="https://play.google.com/store/apps/details?id=com.nikolajszeps.up2" class="btn secondary">Download for
            Android</a>
    </div>

    <script>
        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const eventId = urlParams.get('eventId');
        const inviter = urlParams.get('inviter');
        const inviterName = urlParams.get('inviterName') || inviter;
        const eventTitle = urlParams.get('eventTitle') || 'an awesome event';
        const eventDate = urlParams.get('eventDate') || '';
        const eventLocation = urlParams.get('eventLocation') || '';

        // Update the page content
        document.getElementById('eventTitle').textContent = eventTitle;
        document.getElementById('eventDate').textContent = eventDate ? '📅 ' + eventDate : '';
        document.getElementById('eventLocation').textContent = eventLocation ? '📍 ' + eventLocation : '';
        document.getElementById('inviterName').textContent = inviterName ? 'Invited by: ' + inviterName : '';

        // Create the app scheme URL
        const appScheme = `up2://invite?eventId=${eventId}&inviter=${inviter}&type=event-invite`;
        document.getElementById('openApp').href = appScheme;

        // Try to open the app immediately
        setTimeout(() => {
            try {
                window.location.href = appScheme;
            } catch (e) {
                console.log('Could not open app automatically');
            }
        }, 1000);

        // Fallback: if user is still on page after 3 seconds, show download options
        setTimeout(() => {
            const openingText = document.querySelector('.opening-text');
            if (openingText) {
                openingText.innerHTML =
                    '<p>Having trouble opening the app?</p><p>Try the buttons below to download or open Up2:</p>';
            }
        }, 3000);
    </script>
</body>

</html>
