<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Up2 Invite - Join the Event!</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="You've been invited to an event on Up2!">

    <!-- Open Graph for social sharing -->
    <meta property="og:title" content="You're invited to an Up2 event!">
    <meta property="og:description" content="Tap to open Up2 and join the event">
    <meta property="og:type" content="website">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 400px;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .logo {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .subtitle {
            font-size: 1.1rem;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        .event-card {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .event-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .event-detail {
            margin: 8px 0;
            font-size: 0.95rem;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 15px 20px;
            margin: 12px 0;
            background: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            background: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .status {
            margin: 20px 0;
            padding: 15px;
            background: rgba(76, 175, 80, 0.2);
            border-radius: 10px;
            border: 1px solid rgba(76, 175, 80, 0.3);
        }

        .loading {
            animation: pulse 2s infinite;
            background: rgba(33, 150, 243, 0.2);
            border-color: rgba(33, 150, 243, 0.3);
        }

        @keyframes pulse {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.7;
            }

            100% {
                opacity: 1;
            }
        }

        .small-text {
            font-size: 0.85rem;
            opacity: 0.8;
            margin-top: 20px;
            line-height: 1.4;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">🎉</div>
        <h1>You're Invited!</h1>
        <p class="subtitle">Join an awesome event on Up2</p>

        <div class="event-card">
            <div class="event-title" id="eventTitle">Loading event details...</div>
            <div class="event-detail" id="eventDate"></div>
            <div class="event-detail" id="eventLocation"></div>
            <div class="event-detail" id="eventInviter"></div>
        </div>

        <div class="status loading" id="status">
            🚀 Attempting to open Up2 app...
        </div>

        <a href="#" id="openAppBtn" class="btn">Open Up2 App</a>
        <a href="https://apps.apple.com/search?term=up2" class="btn btn-secondary">Download for iPhone</a>
        <a href="https://play.google.com/store/search?q=up2&c=apps" class="btn btn-secondary">Download for Android</a>

        <p class="small-text">
            If the app doesn't open automatically, try tapping "Open Up2 App" above.<br>
            Don't have Up2? Download it from your app store!
        </p>
    </div>

    <script>
        // Parse URL parameters
        const params = new URLSearchParams(window.location.search);
        const eventId = params.get('eventId') || 'unknown';
        const inviter = params.get('inviter') || '';
        const eventTitle = params.get('eventTitle') || 'an awesome event';
        const eventDate = params.get('eventDate') || '';
        const eventLocation = params.get('eventLocation') || '';
        const inviterName = params.get('inviterName') || inviter;

        // Update page content
        document.getElementById('eventTitle').textContent = eventTitle;
        document.getElementById('eventDate').textContent = eventDate ? `📅 ${eventDate}` : '';
        document.getElementById('eventLocation').textContent = eventLocation ? `📍 ${eventLocation}` : '';
        document.getElementById('eventInviter').textContent = inviterName ? `👤 Invited by ${inviterName}` : '';

        // Create app URL
        const appUrl = `up2://invite?eventId=${eventId}&inviter=${inviter}&type=event-invite`;
        document.getElementById('openAppBtn').href = appUrl;

        // Auto-attempt to open app
        let attemptCount = 0;
        const maxAttempts = 1;

        function tryOpenApp() {
            if (attemptCount < maxAttempts) {
                attemptCount++;
                window.location.href = appUrl;
            }
        }

        // Initial attempt after 1 second
        setTimeout(tryOpenApp, 1000);

        // Update status after 3 seconds
        setTimeout(() => {
            document.getElementById('status').innerHTML = '💡 Trouble opening the app? Use the buttons below!';
            document.getElementById('status').classList.remove('loading');
        }, 3000);

        // Track if user leaves (app opened successfully)
        let userLeft = false;
        window.addEventListener('blur', () => { userLeft = true; });
        window.addEventListener('focus', () => {
            if (userLeft) {
                document.getElementById('status').innerHTML = '✅ Welcome back! The app should be open now.';
                document.getElementById('status').style.background = 'rgba(76, 175, 80, 0.2)';
            }
        });
    </script>
</body>

</html>
